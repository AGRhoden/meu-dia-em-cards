<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graças do Dia</title>
<meta name="theme-color" content="#2f5d47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#131316; --muted:#66666e; --line:#e4e2dc; --line-2:#cfccc4; --wash:#eeece6;
  --accent:#131316; --accent-ink:#ffffff; --ok:#2a8a5c; --focus:#3b47d6;
  --fs:1;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --cond:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Franklin Gothic Medium Cond",sans-serif-condensed,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0d0f; --surface:#17171a; --ink:#f3f3f0; --muted:#9d9da6; --line:#26262b; --line-2:#3b3b43; --wash:#1f1f24;
    --accent:#f3f3f0; --accent-ink:#0d0d0f; --ok:#4cc58c; --focus:#8f9bff;
  }
}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:64px}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* topo */
header.top{max-width:1000px;margin:0 auto;padding:18px clamp(20px,4vw,40px) 0}
/* barra superior */
.banner{--bar:#2f5d47;position:relative;z-index:5;height:clamp(104px,17vw,150px);border-radius:20px;color:#fff;background-color:var(--bar);isolation:isolate}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(110% 150% at 100% 0%,rgba(255,255,255,.18),transparent 58%),repeating-linear-gradient(90deg,rgba(255,255,255,.075) 0 1px,transparent 1px 28px);
  -webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 100%);mask-image:linear-gradient(180deg,#000 10%,transparent 100%)}
.banner.has-cover{background-size:cover;background-position:center}
.banner.has-cover::before{background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,.04) 45%,rgba(0,0,0,.5));-webkit-mask-image:none;mask-image:none}
.banner-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px 14px 20px}
.banner .tools{align-self:flex-end}
.banner .ghost{color:rgba(255,255,255,.9)}
.banner .ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.banner .person-chip{color:#fff}
.banner .acct-in{color:#fff;border-color:rgba(255,255,255,.6)}
.brand{display:flex;align-items:center;gap:12px;margin:0;font-family:var(--cond);font-stretch:condensed;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1;font-weight:300;letter-spacing:.01em;text-shadow:0 1px 12px rgba(0,0,0,.28)}
.brand b{font-weight:600}
.brand i{font-family:var(--serif);font-weight:400;font-size:.6em;margin-left:2px;opacity:.92}
.brand svg{width:.62em;height:.8em;flex:none}
.tools{display:flex;gap:4px;align-items:center}
.ghost{border:0;background:transparent;color:var(--muted);cursor:pointer;min-width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;font-size:.88rem;transition:background .15s,color .15s}
.ghost:hover{background:var(--wash);color:var(--ink)}
.person-chip{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
nav.tabs{display:flex;gap:26px;margin-top:12px;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;background:none;cursor:pointer;padding:10px 0 12px;font-size:.95rem;color:var(--muted);position:relative;font-weight:500}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current=page]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
#tab-hoje{color:var(--ok);font-weight:600}
#tab-hoje:hover{color:var(--ok)}
#tab-hoje:not([aria-current]){opacity:.5}
#tab-hoje:not([aria-current]):hover{opacity:.85}
#tab-hoje[aria-current=page]::after{background:var(--ok)}
main{max-width:1000px;margin:0 auto;padding:34px clamp(20px,4vw,40px) 0}
h2.title{font-size:clamp(1.6rem,3.6vw,2.1rem);font-weight:650;letter-spacing:-.03em;margin:0 0 6px;line-height:1.15}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch;font-size:.95rem}

/* botões */
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:0 22px;border-radius:999px;font-weight:600;font-size:.95rem;cursor:pointer;min-height:44px;transition:transform .1s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sec:hover{background:var(--wash);opacity:1}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ibtn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s,transform .1s}
.ibtn:hover{background:var(--wash);color:var(--ink)}
.ibtn:active{transform:scale(.92)}
.ibtn.go{background:var(--accent);color:var(--accent-ink)}
.ibtn.go:hover{opacity:.85;background:var(--accent);color:var(--accent-ink)}
.ibtn.lg{width:40px;height:40px}
.ibtn:disabled{opacity:.3;cursor:default}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 8px;min-height:36px;border-radius:10px;font-size:.9rem}
.linkbtn:hover{background:var(--wash);color:var(--ink)}
.linkbtn[hidden]{display:none}

/* hoje */
.dateline{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;margin-bottom:4px}
.dateline .date{font-family:var(--cond);font-stretch:condensed;font-size:clamp(2.6rem,8vw,4rem);font-weight:300;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1;margin:0}
.dateline .wd{color:var(--muted);font-size:1rem}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin:26px 0 28px}
.cards>*{min-width:0}
.flip{perspective:1400px}
.inner{display:grid;grid-template-columns:minmax(0,1fr);transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.8,.25,1)}
.flip.flipped .inner{transform:rotateY(180deg)}
.face,.card{grid-area:1/1;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;min-height:200px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:border-color .2s}
.card{grid-area:auto;transition:transform .7s cubic-bezier(.5,0,.9,.4),opacity .7s ease-in,border-color .2s}
.card:focus-within,.face:hover{border-color:var(--line-2)}
.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--ink) 5%,var(--surface))}
.card h3,.face h3{margin:0;display:flex;gap:9px;align-items:center;min-width:0;height:24px}
.kic{display:inline-flex;color:var(--ink);flex:none}
.ttl,input.t{font-family:var(--cond);font-stretch:condensed;font-variant-caps:all-small-caps;font-weight:600;font-size:1.05rem;letter-spacing:.04em;line-height:1.2}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ruled{width:100%;flex:1;min-height:120px;border:0;resize:none;background:transparent;font-size:1rem;line-height:1.6;padding:0;outline:none}
.ruled::placeholder,input.t::placeholder{color:var(--ink);opacity:.5}
input.t{width:100%;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:0 0 6px;border-radius:0;outline:none;color:var(--ink);text-transform:none}
input.t:focus{border-bottom-color:var(--ink)}
.card:focus-within{border-color:var(--ink)}
.face p.txt{margin:0;flex:1;white-space:pre-wrap;word-break:break-word;font-size:1rem;line-height:1.6}
.face p.empty{color:var(--muted)}
.face .corner{position:absolute;bottom:10px;right:12px}
.face .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:auto;margin-right:-4px}
.face.front p.txt{padding-bottom:30px}
.cards .card.sending{opacity:0;transform:translateY(40px) scale(.96)}
.cards .card.sending:nth-child(2){transition-delay:.06s}.cards .card.sending:nth-child(3){transition-delay:.12s}.cards .card.sending:nth-child(4){transition-delay:.18s}.cards .card.sending:nth-child(5){transition-delay:.24s}
.status{min-height:1.4em;font-weight:500;color:#c0392b;font-size:.92rem}
@media (prefers-color-scheme: dark){.status{color:#ff8c7a}}
.okline{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:22px 0 0;color:var(--muted);font-size:.92rem}
.okline b{color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.okline .tick{color:var(--ok);display:inline-flex}
.okline .row{margin-left:auto}


/* calendário */
.bar-top{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;margin:0 0 24px}
.seg{display:inline-flex;background:var(--wash);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:0 16px;min-height:34px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:-8px 0 20px;color:var(--muted);font-size:.85rem}
.legend span{display:inline-flex;gap:7px;align-items:center}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 22px}
.heading h3{margin:0;font-size:1.5rem;font-weight:650;letter-spacing:-.03em;text-transform:capitalize;text-align:center;line-height:1.15}
.heading small{display:block;font-size:.85rem;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;margin-top:4px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
@media (min-width:700px){.months{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}}
.mtile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,transform .15s}
.mtile:hover{border-color:var(--ink);transform:translateY(-2px)}
.mtile .nm{display:flex;align-items:center;justify-content:space-between;font-family:var(--cond);font-stretch:condensed;font-variant-caps:all-small-caps;letter-spacing:.07em;font-size:1.15rem;font-weight:600}
.mtile .tick{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mtile .cnt{font-size:.8rem;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
.mini i{aspect-ratio:1;border-radius:50%;background:var(--line)}
.mini i.on{background:var(--ink)}
.mini i.sp{background:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(3px,1vw,8px)}
.wdh{text-align:center;font-family:var(--cond);font-stretch:condensed;font-variant-caps:all-small-caps;font-size:.95rem;letter-spacing:.1em;color:var(--muted);padding:0 0 10px}
.day{position:relative;aspect-ratio:1/1;min-height:46px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:1rem;border-radius:50%;width:100%;max-width:58px;margin:0 auto;font-variant-numeric:tabular-nums;color:var(--ink);transition:background .15s}
.day:hover:not(:disabled){background:var(--wash)}
.day.has{background:color-mix(in srgb,var(--cc,var(--ink)) 16%,transparent);font-weight:650}
.day.has:hover{background:color-mix(in srgb,var(--cc,var(--ink)) 26%,transparent)}
.day.today{box-shadow:0 0 0 1.5px var(--ink) inset}
.day:disabled{opacity:.28;cursor:default}
.dots{display:flex;gap:3px;justify-content:center;min-height:6px}
.dots .dot{width:6px;height:6px}
.hint-cal{color:var(--muted);font-size:.85rem;margin:18px 0 0}
.person{margin:30px 0 0;display:flex;align-items:center;gap:10px;font-weight:600}
.person .dot{width:12px;height:12px}

/* pessoas */
.plist{display:grid;margin:8px 0 22px;border-top:1px solid var(--line)}
.pitem{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.pitem input[type=text]{flex:1;min-width:140px;border:0;background:transparent;padding:6px 0;font-size:1.05rem;font-weight:500;outline-offset:4px}
.pitem .dot{width:14px;height:14px}
.badge{font-size:.8rem;color:var(--ok);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.note{border:1px dashed var(--line-2);border-radius:16px;padding:14px 18px;color:var(--muted);margin-top:30px;font-size:.92rem}
h2.sec-t{font-size:1.2rem;font-weight:650;letter-spacing:-.02em;margin:44px 0 6px}

/* avatar e menu da conta */
.av{--rc:var(--line);width:26px;height:26px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--rc);overflow:hidden}
.av.xs{width:18px;height:18px;font-size:.62rem;box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--rc)}
.av.sm{width:24px;height:24px;font-size:.72rem}
.av.lg{width:52px;height:52px;font-size:1.3rem}
.avbtn{position:relative;border:0;background:none;padding:4px;cursor:pointer;border-radius:50%;display:inline-flex}
.avbtn .avedit{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.avbtn .avedit svg{width:12px;height:12px}
.avbtn:hover .avedit{opacity:.85}
.menuwrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:220px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:6px;box-shadow:0 12px 32px -8px rgba(0,0,0,.28)}
.menu button{width:100%;border:0;background:none;text-align:left;padding:0 12px;min-height:42px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:.95rem}
.menu button:hover{background:var(--wash)}
.menu small{display:block;padding:8px 12px 4px;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis}
.acct-in{color:var(--ink);font-weight:600;border:1px solid var(--line-2);border-radius:999px}
.sd-who{display:flex;align-items:center;gap:8px}
.dmonth{display:none}
@media print{.dmonth{display:block}}

/* nuvem e família */
.famrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.famrow input{flex:1;min-width:180px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:0 14px;min-height:40px}
.famcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px}
.famcard code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.05rem;letter-spacing:.12em;background:var(--wash);border-radius:8px;padding:2px 8px}
.pname{flex:1;font-size:1.05rem;font-weight:500}

/* personalizar a barra */
.modal-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.52);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px clamp(16px,4vw,28px);max-height:calc(100vh - 32px);overflow:auto}
.modal h3{margin:0 0 16px;font-size:1.25rem;letter-spacing:-.02em}
.modal fieldset{border:0;padding:0;margin:0 0 20px}
.modal legend{font-weight:600;margin:0 0 10px;padding:0}
.modal .opt{font-weight:400;color:var(--muted)}
.sws{display:flex;gap:12px;flex-wrap:wrap}
.swc{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.swc[aria-pressed=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.stage{position:relative;width:100%;aspect-ratio:3/2;background:var(--wash);border-radius:14px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.stage img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.stage .frame{position:absolute;left:8%;top:50%;width:84%;aspect-ratio:6/1;transform:translateY(-50%);box-shadow:0 0 0 999px rgba(0,0,0,.6);border:2px solid #fff;border-radius:10px;pointer-events:none}
.stage .phone{position:absolute;top:0;bottom:0;left:50%;width:52%;transform:translateX(-50%);border-left:1.5px dashed rgba(255,255,255,.9);border-right:1.5px dashed rgba(255,255,255,.9)}
.hint2{margin:8px 2px 12px;color:var(--muted);font-size:.85rem}
.zoomrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.zoomrow input[type=range]{flex:1;accent-color:var(--ink);min-width:0}

/* diário contínuo */
.dbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.dbar .title{margin:0}
.dbar .row{gap:8px}
.dnote{min-height:1.3em;font-size:.85rem;color:var(--muted);padding:8px 0 0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:clamp(24px,5vw,48px);box-shadow:0 20px 40px -28px rgba(0,0,0,.25);max-width:680px;margin:16px auto 0}
.dmonth{font-family:var(--cond);font-stretch:condensed;font-variant-caps:all-small-caps;letter-spacing:.1em;font-size:1.2rem;font-weight:600;color:var(--muted);margin:46px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dmonth:first-child{margin-top:0}
.dday{padding:24px 0 6px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.dd{font-family:var(--cond);font-stretch:condensed;font-size:2rem;font-weight:300;letter-spacing:.01em;margin-right:12px;font-variant-numeric:tabular-nums}
.dw{color:var(--muted);font-size:.9rem}
.dhead .row{gap:2px;flex-wrap:nowrap}
.sd-who{margin:22px 0 10px;font-family:var(--cond);font-stretch:condensed;font-variant-caps:all-small-caps;font-weight:600;font-size:1.05rem;letter-spacing:.08em;color:var(--muted)}
.dhead + .sd-who{margin-top:4px}
.topics{list-style:none;margin:0;padding:0;font-family:var(--serif);font-size:1.12rem;line-height:1.8}
.topics li{position:relative;padding-left:26px;margin:0 0 14px;white-space:pre-wrap;word-break:break-word}
.topics li::before{content:"–";position:absolute;left:4px;color:var(--muted)}
.topics li b{font-weight:700}
.photos{display:grid;gap:12px;margin:18px 0 6px}
.photos.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.photos figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:var(--wash)}
.photos img{display:block;width:100%;height:auto}
.photos .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff}
.photos .rm:hover{background:rgba(0,0,0,.8);color:#fff}
.sd-empty{color:var(--muted);font-family:var(--serif);font-style:italic;margin:0}
.sd-foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.inner,.card,.btn,.mtile{transition:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#111;--muted:#555;--line:#ddd}
  header.top,.dbar,.dnote,.photos .rm,.dhead .row,#live{display:none!important}
  body{padding:0}main{padding:0;max-width:none}
  .sheet{box-shadow:none;border:0;padding:0;max-width:none;margin:0}
  .dday,.photos figure{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="banner" id="banner">
    <div class="banner-in">
      <div class="tools">

const fmt=iso=>{const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const parse=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const okAv=v=>typeof v==='string'&&v.length<=30000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(v);
const inkOn=c=>{const n=parseInt(String(c).slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'#111':'#fff'};

async function makeAvatar(file){
  if(!file.type.startsWith('image/'))throw new Error('Escolha uma imagem.');
  if(file.size>25*1024*1024)throw new Error('Imagem grande demais (máximo 25 MB).');
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Não consegui abrir a imagem.'));i.src=URL.createObjectURL(file)})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,m=Math.min(w,h);
  const c=document.createElement('canvas');c.width=c.height=160;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,160,160);
  x.drawImage(bmp,(w-m)/2,(h-m)/2,m,m,0,0,160,160);
  let q=.85,url='';
  for(let i=0;i<5;i++){url=c.toDataURL('image/jpeg',q);if(url.length<=24000)break;q-=.12}
  if(bmp.close)bmp.close();
  if(!okAv(url))throw new Error('Não consegui reduzir a imagem.');
  return url;
}

/* ---------- Fotos: IndexedDB ---------- */

  const r=indexedDB.open('meu-dia-em-cards',1);

  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('Não foi possível abrir o banco de fotos.'));
}));
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function store(mode){const db=await idb();const t=db.transaction('photos',mode);return {s:t.objectStore('photos'),done:new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}}
async function photosFor(pid,date){const {s}=await store('readonly');const l=await rq(s.index('pd').getAll(IDBKeyRange.only([pid,date])));return l.sort((a,b)=>a.ts-b.ts)}
async function getPhoto(id){const {s}=await store('readonly');return rq(s.get(id))}
async function allPhotos(){const {s}=await store('readonly');return rq(s.getAll())}
async function putPhoto(rec){const {s,done}=await store('readwrite');s.put(rec);await done}
async function delPhoto(id){const {s,done}=await store('readwrite');s.delete(id);await done}
async function delPhotosOf(pid){const {s,done}=await store('readwrite');const keys=await rq(s.index('pid').getAllKeys(IDBKeyRange.only(pid)));keys.forEach(k=>s.delete(k));await done}
async function clearPhotos(){const {s,done}=await store('readwrite');s.clear();await done}

/* Reduz a foto no próprio aparelho: lado maior ≤ 1280 px, JPEG, alvo ≈ 350 KB */
async function shrink(file){
  if(!file.type.startsWith('image/'))throw new Error('“'+file.name+'” não é uma imagem.');
  if(file.size>MAX_INPUT_BYTES)throw new Error('“'+file.name+'” é grande demais (máximo 25 MB).');
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Não consegui abrir “'+file.name+'”.'));i.src=URL.createObjectURL(file)})}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
  let edge=MAX_EDGE,q=.76,blob,w,h;
  for(let i=0;i<6;i++){
    const sc=Math.min(1,edge/Math.max(w0,h0));w=Math.max(1,Math.round(w0*sc));h=Math.max(1,Math.round(h0*sc));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);
    blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(blob&&blob.size<=TARGET_BYTES)break;
    q=Math.max(.5,q-.07);edge=Math.round(edge*.85);
  }
  if(bmp.close)bmp.close();
  if(!blob)throw new Error('Não consegui reduzir “'+file.name+'”.');
  return {blob,w,h};
}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});

/* ---------- Nuvem (Supabase): login Google, sincronização e família ---------- */
const CLOUD={url:'https://pblqerecgcyyodbdcswe.supabase.co',key:'sb_publishable_Pso0Ju-3VNcaQTSKhmPVtg_YyxHAXYZ'};
const sb=(window.supabase&&CLOUD.url)?window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const C={user:null,family:null,msg:'',err:false,busy:false,pendingView:false};
let syncTimer=null;

function markAllDirty(){
  S.profiles.forEach(p=>{if(!p.remote)S.dirty['p:'+p.id]=1});
  Object.keys(S.days).forEach(pid=>{const p=S.profiles.find(x=>x.id===pid);if(p&&!p.remote)Object.keys(S.days[pid]).forEach(d=>{S.dirty['e:'+pid+'|'+d]=1})});
  allPhotos().then(l=>{l.forEach(f=>{if(!f.synced)S.dirty['ph:'+f.id]=1});save()}).catch(()=>{});
}

async function pushDirty(){
  const order=k=>({p:0,e:1,ph:2,phd:3,pd:4})[k.slice(0,k.indexOf(':'))];
  const keys=Object.keys(S.dirty).sort((a,b)=>order(a)-order(b));
  for(const k of keys){
    const t=k.slice(0,k.indexOf(':')),rest=k.slice(k.indexOf(':')+1);
    if(t==='p'){
      const p=S.profiles.find(x=>x.id===rest);
      if(p&&!p.remote){const {error}=await sb.from('people').upsert({id:p.id,owner_id:C.user.id,name:p.name.slice(0,60),color:p.color,avatar:okAv(p.avatar)?p.avatar:null,family_id:C.family?C.family.id:null});if(error)throw error;p.synced=true;delete p.blank}
    }else if(t==='e'){
      const [pid,date]=rest.split('|'),p=S.profiles.find(x=>x.id===pid),en=entryOf(pid,date);
      if(p&&!p.remote){
        if(!p.synced){const pr=await sb.from('people').upsert({id:p.id,owner_id:C.user.id,name:p.name.slice(0,60),color:p.color,avatar:okAv(p.avatar)?p.avatar:null,family_id:C.family?C.family.id:null});if(pr.error)throw pr.error;p.synced=true;delete p.blank;delete S.dirty['p:'+p.id]}
        if(hasContent(en)){
          const c=en.custom||{};
          const {error}=await sb.from('entries').upsert({person_id:pid,date,bom:en.bom||'',descoberta:en.descoberta||'',acao:en.acao||'',acontecimento:en.acontecimento||'',custom_titulo:c.titulo||'',custom_texto:c.texto||''});
          if(error)throw error;
        }else{const {error}=await sb.from('entries').delete().eq('person_id',pid).eq('date',date);if(error)throw error}
      }
    }else if(t==='ph'){
      const rec=await getPhoto(rest);
      if(rec){
        const path=`${rec.pid}/${rec.id}.jpg`;
        const up=await sb.storage.from('photos').upload(path,rec.blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;
        const ins=await sb.from('photos').upsert({id:rec.id,person_id:rec.pid,date:rec.date,path,w:rec.w,h:rec.h,bytes:rec.blob.size});if(ins.error)throw ins.error;
        rec.synced=true;await putPhoto(rec);
      }
    }else if(t==='phd'){
      const [pid,id]=rest.split('|');
      const r1=await sb.storage.from('photos').remove([`${pid}/${id}.jpg`]);if(r1.error)throw r1.error;
      const r2=await sb.from('photos').delete().eq('id',id);if(r2.error)throw r2.error;
    }else if(t==='pd'){
      const l=await sb.storage.from('photos').list(rest,{limit:1000});
      if(!l.error&&l.data&&l.data.length){await sb.storage.from('photos').remove(l.data.map(o=>`${rest}/${o.name}`))}
      const {error}=await sb.from('people').delete().eq('id',rest);if(error)throw error;
    }
    delete S.dirty[k];save();
  }
}

async function pullAll(){
  const uid=C.user.id;
  const pr=await sb.from('people').select('id,owner_id,name,color,avatar');if(pr.error)throw pr.error;
  const remoteIds=new Set(pr.data.map(r=>r.id));
  const hasMine=pr.data.some(r=>r.owner_id===uid);
  for(const r of pr.data){
    let p=S.profiles.find(x=>x.id===r.id);
    if(!p){p={id:r.id,name:r.name,color:r.color};S.profiles.push(p)}
    else if(!S.dirty['p:'+r.id]){p.name=r.name;p.color=r.color}
    p.remote=r.owner_id!==uid;p.synced=true;delete p.blank;
    if(!S.dirty['p:'+r.id]){if(okAv(r.avatar))p.avatar=r.avatar;else delete p.avatar}
  }
  // conta nova (sem pessoas na nuvem): sobe a pessoa inicial
  if(!hasMine)S.profiles.forEach(p=>{if(!p.remote&&!p.synced)S.dirty['p:'+p.id]=1});
  // cores diferentes dentro da família
  const taken=new Set(S.profiles.filter(p=>p.remote).map(p=>p.color));
  S.profiles.forEach(p=>{if(!p.remote&&taken.has(p.color)){const c=COLORS.find(c=>!S.profiles.some(q=>q.color===c));if(c){p.color=c;S.dirty['p:'+p.id]=1;setTimeout(scheduleSync,0)}}});
  // a pessoa inicial vazia some se a conta já tem pessoas na nuvem
  if(hasMine)S.profiles=S.profiles.filter(p=>!(p.blank&&!p.synced));
  // pessoas removidas em outro lugar (ou família deixada)
  S.profiles=S.profiles.filter(p=>!p.synced||remoteIds.has(p.id)||S.dirty['p:'+p.id]);
  if(!S.profiles.some(p=>!p.remote)){const id=uid_();S.profiles.push({id,name:'Eu',color:COLORS[0]});S.active=id;S.dirty['p:'+id]=1}
  else{delete (S.profiles.find(p=>p.blank)||{}).blank}
  if(!S.profiles.some(p=>p.id===S.active&&!p.remote))S.active=S.profiles.find(p=>!p.remote).id;
  const ids=[...remoteIds];
  // dias
  let rows=[];
  if(ids.length)for(let from=0;;from+=1000){
    const r=await sb.from('entries').select('*').in('person_id',ids).range(from,from+999);if(r.error)throw r.error;
    rows=rows.concat(r.data);if(r.data.length<1000)break;
  }
  const have=new Set();
  rows.forEach(r=>{
    const k=r.person_id+'|'+r.date;have.add(k);if(S.dirty['e:'+k])return;
    (S.days[r.person_id]=S.days[r.person_id]||{})[r.date]={bom:r.bom,descoberta:r.descoberta,acao:r.acao,acontecimento:r.acontecimento,custom:{titulo:r.custom_titulo,texto:r.custom_texto}};
  });
  ids.forEach(pid=>{const m=S.days[pid]||{};Object.keys(m).forEach(d=>{if(!have.has(pid+'|'+d)&&!S.dirty['e:'+pid+'|'+d])delete m[d]})});
  Object.keys(S.days).forEach(pid=>{if(!S.profiles.some(p=>p.id===pid))delete S.days[pid]});
  // fotos
  try{
    let prow=[];
    if(ids.length)for(let from=0;;from+=1000){
      const r=await sb.from('photos').select('id,person_id,date,path,w,h,created_at').in('person_id',ids).range(from,from+999);if(r.error)throw r.error;
      prow=prow.concat(r.data);if(r.data.length<1000)break;
    }
    const local=await allPhotos(),localIds=new Set(local.map(f=>f.id)),remoteP=new Set(prow.map(r=>r.id));
    for(const r of prow){
      if(localIds.has(r.id)||S.dirty['phd:'+r.person_id+'|'+r.id])continue;
      const d=await sb.storage.from('photos').download(r.path);
      if(!d.error&&d.data)await putPhoto({id:r.id,pid:r.person_id,date:r.date,w:r.w,h:r.h,ts:Date.parse(r.created_at),blob:d.data,synced:true});
    }
    for(const f of local){if(f.synced&&!remoteP.has(f.id)&&!S.dirty['ph:'+f.id])await delPhoto(f.id)}
  }catch(e){console.warn('fotos',e)}
}
const uid_=()=>uid();

async function syncNow(){
  if(!sb||!C.user||C.busy)return;
  C.busy=true;C.msg='Sincronizando…';C.err=false;cloudLine();
  let failure=null;
  try{await pushDirty()}catch(e){failure=e}
  try{await pullAll()}catch(e){failure=failure||e}
  try{const r=await sb.rpc('get_my_family');C.family=r.error?C.family:(r.data||null)}catch(e){}
  if(failure){console.warn(failure);C.err=true;C.msg=navigator.onLine?'Não consegui sincronizar agora. Tento de novo em instantes.':'Sem conexão. Vai sincronizar quando voltar.'}
  else{C.msg='Sincronizado às '+hhmm()}
  C.busy=false;save();cloudLine();safeRender();
  if(failure)setTimeout(syncNow,30000);
  else if(Object.keys(S.dirty).length)setTimeout(syncNow,300);   // a leitura criou pendências (ex.: pessoa inicial)
}
function safeRender(){
  // não redesenha enquanto a pessoa está escrevendo ou editando um card
  const a=document.activeElement,typing=a&&/^(TEXTAREA|INPUT)$/.test(a.tagName)&&$app.contains(a);
  const compose=document.getElementById('compose'),composing=compose&&[...compose.querySelectorAll('[data-f]')].some(x=>x.value.trim());
  if(typing||composing||document.querySelector('.flip.flipped')){C.pendingView=true;return}
  C.pendingView=false;render(true);
}
async function afterLogin(user){
  C.user=user;
  if(S.cloudUser&&S.cloudUser!==user.id){
    if(!confirm('Este aparelho está ligado a outra conta Google. Entrar com esta conta troca os dados do aparelho pelos dela (os da outra conta continuam guardados na nuvem). Continuar?')){C.user=null;await sb.auth.signOut();return}
    try{await clearPhotos()}catch(e){}
    const id=uid();S={v:1,profiles:[{id,name:'Eu',color:COLORS[0],blank:true}],active:id,days:{},font:S.font||1,dirty:{}};
  }
  const gname=String((user.user_metadata&&(user.user_metadata.name||user.user_metadata.full_name))||'').trim().split(/\s+/)[0];
  if(!S.cloudUser){
    const bp=S.profiles.find(p=>p.blank&&p.name==='Eu');if(bp&&gname)bp.name=gname.slice(0,30);
    S.cloudUser=user.id;
    let photos=[];try{photos=await allPhotos()}catch(e){}
    const hasData=Object.values(S.days).some(m=>Object.keys(m).length)||S.profiles.length>1||photos.length>0||S.profiles.some(p=>!p.blank);
    if(hasData)markAllDirty();
  }
  save();render(true);syncNow();
}

/* ---------- Cards ---------- */
function titleOf(kind,en){return kind.custom?((en&&en.custom&&en.custom.titulo)||'Card livre'):kind.t}
function head(kind,en){return `<h3><span class="kic" aria-hidden="true">${ICON[kind.k]}</span><span class="ttl" title="${esc(titleOf(kind,en))}">${esc(titleOf(kind,en))}</span></h3>`}
function valueOf(kind,en){
  if(!en)return kind.custom?{titulo:'',texto:''}:'';
  if(kind.custom)return en.custom||{titulo:'',texto:''};
  return en[kind.k]||'';
}
function composeCard(kind,idp){
  const lab=`${idp}-${kind.k}`;
  if(kind.custom){
    return `<article class="card k-${kind.k}" data-k="${kind.k}">
      <h3><span class="kic" aria-hidden="true">${ICON[kind.k]}</span><label class="ttl" for="${lab}-t">${kind.t}</label></h3>
      <input class="t" id="${lab}-t" data-f="custom-t" maxlength="40" placeholder="Dê um título (opcional)">
      <label class="sr" for="${lab}">Texto do card livre</label>
      <textarea class="ruled" id="${lab}" data-f="custom-x" placeholder="${esc(kind.h)}"></textarea></article>`;
  }
  return `<article class="card k-${kind.k}" data-k="${kind.k}">
    <h3><span class="kic" aria-hidden="true">${ICON[kind.k]}</span><label class="ttl" for="${lab}">${kind.t}</label></h3>
    <textarea class="ruled" id="${lab}" data-f="${kind.k}" placeholder="${esc(kind.h)}"></textarea></article>`;
}
function flipCard(kind,en,pid,iso,editable){
  const v=valueOf(kind,en);
  const text=kind.custom?v.texto:v;
  const key=`${pid}|${iso}|${kind.k}`;
  const lab='f'+key.replace(/[^a-z0-9]/gi,'');
  const ttl=titleOf(kind,en);
  const front=`<div class="face front">${head(kind,en)}
      ${text.trim()?`<p class="txt">${esc(text)}</p>`:`<p class="txt empty">Em branco</p>`}
      ${editable?`<span class="corner">${ibtn('flip',ICON.edit,`Editar “${ttl}” (virar o card)`)}</span>`:''}</div>`;
  if(!editable)return `<div class="flip"><div class="inner">${front}</div></div>`;
  const back=`<div class="face back" inert>
      ${kind.custom?`<h3><span class="kic" aria-hidden="true">${ICON.custom}</span><input class="t" data-f="custom-t" maxlength="40" aria-label="Título do card livre" placeholder="Card livre" value="${esc(v.titulo)}" style="padding-bottom:0;border:0;min-width:0"></h3>`:`<h3><span class="kic" aria-hidden="true">${ICON[kind.k]}</span><label class="ttl" for="${lab}">${kind.t}</label></h3>`}
      <textarea class="ruled" id="${lab}" data-f="${kind.custom?'custom-x':kind.k}" ${kind.custom?'aria-label="Texto do card livre"':''} placeholder="${esc(kind.h)}">${esc(text)}</textarea>
      <div class="actions">${ibtn('flip',ICON.x,'Cancelar')}${ibtn('fixsave',ICON.check,'Salvar correção',`data-pid="${pid}" data-date="${iso}" data-k="${kind.k}"`,'go lg')}</div></div>`;
  return `<div class="flip" data-key="${key}"><div class="inner">${front}${back}</div></div>`;
}
function readCards(pid,iso,editable){
  const en=entryOf(pid,iso);
  return KINDS.filter(k=>editable||(k.custom?(en&&en.custom&&(en.custom.texto||'').trim()):(en&&(en[k.k]||'').trim())))
    .map(k=>flipCard(k,en,pid,iso,editable)).join('');
}

  for(let d=1;d<=n;d++)if(daysWith(isoOf(y,m,d)).length)c++;

    }

      <h3>${MESES[c.m]} ${c.y}<small>${monthCount(c.y,c.m)} de ${n} dias guardados</small></h3>

  }
  return h;

async function fillDiary(note){
  const box=document.getElementById('diary');if(!box)return;

  const people=fam?S.profiles:[S.profiles.find(p=>p.id===V.dwho)||me()];

async function addPhotos(files){
  const T=V.photoTarget;if(!T||!files.length)return;
  const target=S.profiles.find(p=>p.id===T.pid)||me();
  let cur;try{cur=(await photosFor(target.id,T.date)).length}catch(e){dnote(e.message);return}
  const room=MAX_PHOTOS_DAY-cur;
  if(room<=0){dnote(`Limite de ${MAX_PHOTOS_DAY} fotos neste dia para ${target.name}.`);return}
  const list=[...files].slice(0,room),skipped=files.length-list.length;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  let ok=0,errs=[];
  for(let i=0;i<list.length;i++){
    dnote(`Reduzindo foto ${i+1} de ${list.length}…`);
    try{const r=await shrink(list[i]);const nid=uid();await putPhoto({id:nid,pid:target.id,date:T.date,blob:r.blob,w:r.w,h:r.h,ts:Date.now()+i,synced:false});S.dirty['ph:'+nid]=1;ok++}
    catch(e){errs.push(e.message||'Falha ao guardar a foto.')}
  }
  const parts=[];
  if(ok)parts.push(ok===1?'1 foto adicionada.':`${ok} fotos adicionadas.`);
  if(skipped>0)parts.push(`${skipped} ficou de fora: limite de ${MAX_PHOTOS_DAY} por dia.`);
  if(errs.length)parts.push(errs[0]);
  save();scheduleSync();
  await fillDiary(parts.join(' '));live(parts.join(' '));
}

/* ---------- Barra superior: cor, imagem de capa e máscara ---------- */
const BAR_COLORS=[{k:'verde',n:'Verde',c:'#2f5d47'},{k:'roxo',n:'Roxo',c:'#4b3a6b'},{k:'vermelho',n:'Vermelho',c:'#8a2b2b'},{k:'azul',n:'Azul',c:'#234a7d'},{k:'dourado',n:'Dourado',c:'#8a6a1f'},{k:'rosa',n:'Rosa',c:'#a5476b'},{k:'grafite',n:'Grafite',c:'#2a2c33'}];
const BAR_KEY='gd-bar-cover',BAR_SRC='gd-bar-src',BAR_AR=6;
const barColor=k=>(BAR_COLORS.find(x=>x.k===k)||BAR_COLORS[0]).c;
function applyBar(){
  const b=document.getElementById('banner');if(!b)return;
  const bar=S.bar||{};b.style.setProperty('--bar',barColor(bar.color));
  let cover=null;try{cover=bar.cover?localStorage.getItem(BAR_KEY):null}catch(e){}
  if(cover&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(cover)){b.classList.add('has-cover');b.style.backgroundImage=`url("${cover}")`}
  else{b.classList.remove('has-cover');b.style.backgroundImage=''}
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=barColor(bar.color);
}
let M=null,barReturn=null;
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Não consegui abrir a imagem.'));i.src=src});
async function readBarFile(file){
  if(!file.type.startsWith('image/'))throw new Error('Escolha uma imagem.');
  if(file.size>25*1024*1024)throw new Error('Imagem grande demais (máximo 25 MB).');
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Não consegui abrir a imagem.'));i.src=URL.createObjectURL(file)})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,k=Math.min(1,1800/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  let q=.85,url='';for(let i=0;i<5;i++){url=c.toDataURL('image/jpeg',q);if(url.length<=330000)break;q-=.1}
  if(bmp.close)bmp.close();return url;
}
function barModalHTML(){
  const sw=BAR_COLORS.map(c=>`<button type="button" class="swc" style="--c:${c.c}" data-a="barcolor" data-v="${c.k}" aria-pressed="${M.color===c.k}" aria-label="${c.n}" title="${c.n}"></button>`).join('');
  const cover=M.img?`<div class="stage" id="stage" tabindex="0" role="group" aria-label="Enquadramento da capa. Arraste a imagem. Setas movem, mais e menos ampliam."><img id="stimg" alt="" draggable="false"><div class="frame"><div class="phone"></div></div></div>

      <div class="zoomrow">${ibtn('barzoom',ICON.minus,'Reduzir','data-v="-1"')}<input type="range" id="zoomr" min="100" max="500" value="${Math.round(M.z*100)}" aria-label="Ampliação da imagem">${ibtn('barzoom',ICON.plus,'Ampliar','data-v="1"')}</div>
      <div class="row"><button class="btn sec sm" data-a="barpick">Trocar imagem</button><button class="btn sec sm" data-a="barnoimg">Remover imagem</button></div>`

    <div class="row" style="justify-content:flex-end"><button class="btn sec" data-a="barcancel">Cancelar</button><button class="btn" data-a="barsave">Salvar</button></div>`;
}
function barLayout(){
  const st=document.getElementById('stage'),im=document.getElementById('stimg');if(!st||!im||!M||!M.img)return;
  const W=st.clientWidth,H=st.clientHeight,fw=W*.84,fh=fw/BAR_AR,w0=M.w0,h0=M.h0;
  const smin=Math.max(fw/w0,fh/h0);M.z=Math.min(5,Math.max(1,M.z));
  const sc=smin*M.z,mx=(w0*sc-fw)/2,my=(h0*sc-fh)/2;
  let ox=Math.max(-mx,Math.min(mx,M.px*fw)),oy=Math.max(-my,Math.min(my,M.py*fw));
  M.px=ox/fw;M.py=oy/fw;M.fw=fw;M.fh=fh;M.s=sc;
  im.style.width=w0*sc+'px';im.style.height=h0*sc+'px';
  im.style.left=(W/2+ox-w0*sc/2)+'px';im.style.top=(H/2+oy-h0*sc/2)+'px';
  const zr=document.getElementById('zoomr');if(zr)zr.value=Math.round(M.z*100);
}
function barRender(){const box=document.querySelector('#barmodal .modal');if(!box)return;box.innerHTML=barModalHTML();if(M.img){const i=document.getElementById('stimg');i.src=M.src;barLayout()}}
async function openBarEditor(trigger){

  M={color:bar.color||'verde',img:null,src:null,w0:0,h0:0,z:1,px:0,py:0,fw:0,fh:0,s:1,touched:false,removed:false};

function barExport(){
  const sc=M.s,sw=M.fw/sc,sh=M.fh/sc,sx=M.w0/2-M.px*M.fw/sc-sw/2,sy=M.h0/2-M.py*M.fw/sc-sh/2;
  const W=1800,H=Math.round(W/BAR_AR),c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,W,H);x.drawImage(M.img,sx,sy,sw,sh,0,0,W,H);
  let q=.84,url='';for(let i=0;i<5;i++){url=c.toDataURL('image/jpeg',q);if(url.length<=280000)break;q-=.1}
  return url;
}
function barSave(){
  const old=S.bar||{},bar={color:M.color};
  try{
    if(M.removed||!M.img){localStorage.removeItem(BAR_KEY);localStorage.removeItem(BAR_SRC)}
    else if(!M.touched&&old.cover){bar.cover=true;bar.t=old.t;bar.hasSrc=old.hasSrc}
    else{
      localStorage.setItem(BAR_KEY,barExport());
      try{localStorage.setItem(BAR_SRC,M.src);bar.hasSrc=true}catch(e){localStorage.removeItem(BAR_SRC);bar.hasSrc=false}
      bar.cover=true;bar.t={z:M.z,px:M.px,py:M.py};

const barPtrs=new Map();let barLast=0;
document.addEventListener('pointerdown',e=>{const st=e.target.closest&&e.target.closest('#stage');if(!st||!M)return;try{st.setPointerCapture(e.pointerId)}catch(_){}barPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});barLast=0});
document.addEventListener('pointermove',e=>{
  if(!M||!barPtrs.has(e.pointerId))return;const p=barPtrs.get(e.pointerId);
  if(barPtrs.size===1){M.px+=(e.clientX-p.x)/M.fw;M.py+=(e.clientY-p.y)/M.fw;M.touched=true;barLayout()}
  barPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(barPtrs.size===2){const [a,b]=[...barPtrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(barLast){M.z*=d/barLast;M.touched=true;barLayout()}barLast=d}
});
const barEnd=e=>{barPtrs.delete(e.pointerId);barLast=0};
document.addEventListener('pointerup',barEnd);document.addEventListener('pointercancel',barEnd);
document.addEventListener('wheel',e=>{const st=e.target.closest&&e.target.closest('#stage');if(!st||!M)return;e.preventDefault();M.z*=Math.exp(-e.deltaY*.0015);M.touched=true;barLayout()},{passive:false});

document.addEventListener('keydown',e=>{
  if(!M)return;
  if(e.key==='Escape'){e.preventDefault();closeBar();return}
  if(e.target.id!=='stage')return;
  const st=12/(M.fw||1);let used=true;
  if(e.key==='ArrowLeft')M.px-=st;else if(e.key==='ArrowRight')M.px+=st;else if(e.key==='ArrowUp')M.py-=st;else if(e.key==='ArrowDown')M.py+=st;
  else if(e.key==='+'||e.key==='=')M.z*=1.08;else if(e.key==='-')M.z/=1.08;else used=false;

});
document.addEventListener('change',async e=>{

function readFields(root){
  const o={};
  root.querySelectorAll('[data-f]').forEach(el=>{o[el.dataset.f]=el.value});
  return o;
}
function applyFields(pid,iso,f){
  S.days[pid]=S.days[pid]||{};
  const en=S.days[pid][iso]||{};
  ['bom','descoberta','acao','acontecimento'].forEach(k=>{if(k in f)en[k]=f[k].trim()});
  if('custom-x' in f||'custom-t' in f){
    const old=en.custom||{};
    en.custom={titulo:('custom-t' in f?f['custom-t']:old.titulo||'').trim(),texto:('custom-x' in f?f['custom-x']:old.texto||'').trim()};
  }
  S.days[pid][iso]=en;
  if(!hasContent(en))delete S.days[pid][iso];
  S.dirty['e:'+pid+'|'+iso]=1;scheduleSync();
}
function guardar(){
  const root=document.getElementById('compose');
  const f=readFields(root);
  const filled=['bom','descoberta','acao','acontecimento'].some(k=>(f[k]||'').trim())||(f['custom-x']||'').trim();
  if(!filled){V.msg='Escreva em pelo menos um card para guardar.';document.getElementById('status').textContent=V.msg;live(V.msg);return}
  const p=me(),iso=V.date;
  applyFields(p.id,iso,f);save();V.saving=true;V.msg='';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('.card').forEach(c=>c.classList.add('sending'));
  setTimeout(()=>{V.saving=false;render();live(`Dia ${fmt(iso)} guardado no calendário.`)},reduce?0:900);
}

function doImport(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.profiles)||!d.profiles.length||typeof d.days!=='object')throw 0;
      if(!confirm('Importar vai substituir os dados deste aparelho (incluindo fotos). Continuar?'))return;
      const photos=Array.isArray(d.photos)?d.photos:[];delete d.photos;
      try{await clearPhotos();for(const p of photos){const blob=await (await fetch(p.data)).blob();await putPhoto({id:p.id,pid:p.pid,date:p.date,w:p.w,h:p.h,ts:p.ts,blob})}}catch(err){}
      S=d;S.dirty={};S.profiles.forEach(p=>{delete p.remote;delete p.synced});S.cloudUser=C.user?C.user.id:null;
      if(!S.profiles.some(p=>p.id===S.active))S.active=S.profiles[0].id;
      try{(await allPhotos()).forEach(f=>{f.synced=false;putPhoto(f)})}catch(err){}

    }catch(err){alert('Este arquivo não parece ser um backup válido do app.')}

    case 'avdel':{const pp=S.profiles.find(x=>x.id===el.dataset.pid);if(pp&&!pp.remote){delete pp.avatar;S.dirty['p:'+pp.id]=1;save();scheduleSync();render(true);live('Foto removida.')}break}
    case 'dmo':{const i=V.dmonths.indexOf(V.dmonth)+ +v;if(V.dmonths[i]){V.dmonth=V.dmonths[i];fillDiary();window.scrollTo(0,0)}break}
    case 'font':S.font=Math.min(1.5,Math.max(.85,+((S.font||1)+v*.1).toFixed(2)));save();render(true);break;
    case 'guardar':guardar();break;
    case 'flip':toggleFlip(el);break;
    case 'fixsave':fixsave(el);break;
    case 'opencal':{const d=parse(el.dataset.date);V.cal={lvl:'day',y:d.getFullYear(),m:d.getMonth(),d:d.getDate()};V.tab='cal';render();break}
    case 'gohoje':V.date=el.dataset.date;V.tab='hoje';V.msg='';render();break;
    case 'gohoje-real':goToday();break;
    case 'scope':V.scope=v;render(true);break;
    case 'calgo':c.lvl=el.dataset.l;render();break;
    case 'calnow':c.y=now.getFullYear();c.m=now.getMonth();render(true);break;
    case 'yr':c.y+=+v;render(true);break;
    case 'openmonth':c.m=+el.dataset.m;c.lvl='month';render();break;
    case 'mo':{let m=c.m+ +v,y=c.y;if(m<0){m=11;y--}if(m>11){m=0;y++}c.m=m;c.y=y;render(true);break}
    case 'openday':c.d=+el.dataset.d;c.lvl='day';render();break;
    case 'dy':moveDay(+v);break;
    case 'setme':if((S.profiles.find(x=>x.id===el.dataset.pid)||{}).remote)break;S.active=el.dataset.pid;save();render(true);live('Agora escrevendo como '+me().name);break;
    case 'addp':addPerson();break;
    case 'delp':{
      const p=S.profiles.find(x=>x.id===el.dataset.pid);
      if(!confirm(`Remover ${p.name} e todos os cards e fotos dessa pessoa? Isso não pode ser desfeito.`))break;
      S.profiles=S.profiles.filter(x=>x.id!==p.id);delete S.days[p.id];Object.keys(S.dirty).forEach(k=>{if(k.includes(p.id))delete S.dirty[k]});if(p.synced)S.dirty['pd:'+p.id]=1;
      if(S.active===p.id)S.active=S.profiles[0].id;save();scheduleSync();delPhotosOf(p.id).catch(()=>{});render(true);break}
    case 'export':exportData();break;
    case 'baredit':openBarEditor(el);break;
    case 'barcolor':if(M){M.color=v;document.querySelectorAll('#barmodal .swc').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));document.getElementById('banner').style.setProperty('--bar',barColor(v))}break;
    case 'barzoom':if(M){M.z*=v>0?1.15:1/1.15;M.touched=true;barLayout()}break;
    case 'barpick':document.getElementById('barin').click();break;
    case 'barnoimg':if(M){M.img=null;M.src=null;M.removed=true;M.touched=true;barRender()}break;
    case 'barcancel':closeBar();break;
    case 'barsave':barSave();break;
    case 'gsignin':cloudSignIn();break;
    case 'gsignout':V.acct=false;cloudSignOut();break;
    case 'syncnow':syncNow();break;
    case 'famcreate':{const n=(document.getElementById('famname').value||'').trim();if(!n){C.err=true;C.msg='Dê um nome para a família.';cloudLine();break}famAct(()=>sb.rpc('create_family',{fname:n}),'Família criada. Compartilhe o código de convite.');break}
    case 'famjoin':{const c=(document.getElementById('famcode').value||'').trim();if(!c){C.err=true;C.msg='Digite o código de convite.';cloudLine();break}famAct(()=>sb.rpc('join_family',{fcode:c}),'Você entrou na família.');break}
    case 'famleave':if(confirm('Sair da família? Você deixa de ver os dias dos outros e eles deixam de ver os seus. Seus dados continuam com você.'))famAct(()=>sb.rpc('leave_family'),'Você saiu da família.');break;
    case 'famcopy':navigator.clipboard&&C.family&&navigator.clipboard.writeText(C.family.code).then(()=>{C.err=false;C.msg='Código copiado.';cloudLine()});break;
    case 'dwho':V.dwho=v;render(true);break;
    case 'dprint':window.print();break;
    case 'phadd':V.photoTarget={date:el.dataset.date,pid:el.dataset.pid};document.getElementById('phin').click();break;
    case 'phdel':if(confirm('Remover esta foto do diário?')){const id=el.dataset.id,pid=el.dataset.pid;delPhoto(id).then(()=>{if(S.dirty['ph:'+id])delete S.dirty['ph:'+id];else S.dirty['phd:'+pid+'|'+id]=1;save();scheduleSync();return fillDiary('Foto removida.')}).catch(()=>{})}break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='avin'){const f=el.files[0];el.value='';if(!f)return;
    const pp=S.profiles.find(x=>x.id===V.avTarget);if(!pp||pp.remote)return;
    makeAvatar(f).then(url=>{pp.avatar=url;S.dirty['p:'+pp.id]=1;save();scheduleSync();render(true);live('Foto atualizada.')}).catch(err=>{alert(err.message||'Não consegui usar essa imagem.')});return}
  if(el.id==='phin'){const files=[...el.files];el.value='';addPhotos(files);return}
  if(el.dataset.a==='rename'){const p=S.profiles.find(x=>x.id===el.dataset.pid);if(p.remote)return;p.name=el.value.trim()||p.name;S.dirty['p:'+p.id]=1;save();scheduleSync();render(true)}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(V.acct){V.acct=false;renderAccount();return}
  const fl=e.target.closest&&e.target.closest('.flip.flipped');
  if(fl){const b=fl.querySelector('.back [data-a=flip]');b&&toggleFlip(b)}
});
render();
applyBar();
document.getElementById('baredit').innerHTML=ICON.image;
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
